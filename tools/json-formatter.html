<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON格式化工具 - 在线JSON美化/压缩/验证 | 免费在线工具箱</title>
<meta name="description" content="免费在线JSON格式化工具，支持JSON美化、压缩、验证、转义。一键格式化混乱的JSON数据，开发者必备。">
<meta name="keywords" content="JSON格式化,JSON美化,JSON压缩,JSON验证,在线JSON工具">
<link rel="canonical" href="https://tool-site.pages.dev/tools/json-formatter.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8f9fa;color:#333}
.header{background:#1a1a2e;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px}
.header a{color:#aaa;text-decoration:none;font-size:.9em}
.header a:hover{color:#fff}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.6em;margin-bottom:4px}
.subtitle{color:#888;margin-bottom:20px;font-size:.9em}
.tool-area{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tool-area button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.9em;font-weight:600;transition:background .2s}
.btn-format{background:#4a90d9;color:#fff}
.btn-compress{background:#666;color:#fff}
.btn-validate{background:#27ae60;color:#fff}
.btn-clear{background:#e0e0e0;color:#333}
.btn-copy{background:#f39c12;color:#fff}
textarea{width:100%;height:300px;padding:16px;border:2px solid #e0e0e0;border-radius:8px;font-family:'Consolas','Monaco',monospace;font-size:.9em;resize:vertical;outline:none}
textarea:focus{border-color:#4a90d9}
.result-msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.9em}
.result-msg.success{background:#d5f5e3;color:#27ae60}
.result-msg.error{background:#fadbd8;color:#e74c3c}
.ad-placeholder{background:#f0f0f0;border:2px dashed #ddd;border-radius:12px;padding:24px;text-align:center;color:#bbb;margin:20px 0}
.footer{text-align:center;padding:20px;color:#aaa;font-size:.85em;border-top:1px solid #eee;margin-top:30px}
.breadcrumb{margin-bottom:16px;font-size:.85em;color:#888}
.breadcrumb a{color:#4a90d9;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <a href="/">← 工具箱首页</a>
  <span>JSON格式化工具</span>
</div>

<div class="container">
  <div class="breadcrumb"><a href="/">首页</a> › JSON格式化工具</div>
  <h1>📋 JSON格式化工具</h1>
  <p class="subtitle">支持JSON美化、压缩、验证。粘贴混乱的JSON，一键变整齐。</p>

  <div class="ad-placeholder" style="padding:12px;margin-bottom:16px">广告位</div>

  <div class="tool-area">
    <button class="btn-format" onclick="format()">✨ 格式化/美化</button>
    <button class="btn-compress" onclick="compress()">📦 压缩</button>
    <button class="btn-validate" onclick="validate()">✅ 验证</button>
    <button class="btn-clear" onclick="clearAll()">🗑️ 清空</button>
    <button class="btn-copy" onclick="copyResult()">📋 复制结果</button>
  </div>

  <textarea id="input" placeholder='粘贴你的JSON数据，例如：{"name":"张三","age":25,"hobbies":["读书","跑步"]}'></textarea>
  <textarea id="output" placeholder="格式化结果将显示在这里..." readonly></textarea>
  <div id="msg"></div>

  <div class="ad-placeholder">广告位</div>
</div>

<div class="footer">
  <p>JSON格式化工具 · 在线工具箱 © 2026</p>
</div>

<script>
function $(id){return document.getElementById(id)}
function msg(type,text){const m=$('msg');m.className='result-msg '+type;m.textContent=text}

function format(){
  try{const obj=JSON.parse($('input').value);$('output').value=JSON.stringify(obj,null,2);msg('success','✅ 格式化成功')}
  catch(e){msg('error','❌ JSON格式错误：'+e.message)}
}
function compress(){
  try{const obj=JSON.parse($('input').value);$('output').value=JSON.stringify(obj);msg('success','✅ 压缩成功')}
  catch(e){msg('error','❌ JSON格式错误：'+e.message)}
}
function validate(){
  try{JSON.parse($('input').value);msg('success','✅ JSON格式正确！')}
  catch(e){msg('error','❌ 格式错误：'+e.message)}
}
function clearAll(){$('input').value='';$('output').value='';$('msg').textContent='';$('msg').className=''}
function copyResult(){
  const v=$('output').value||$('input').value
  if(!v){msg('error','⚠️ 没有可复制的内容');return}
  navigator.clipboard.writeText(v).then(()=>msg('success','✅ 已复制到剪贴板'))
}
</script>
</body>
</html>
